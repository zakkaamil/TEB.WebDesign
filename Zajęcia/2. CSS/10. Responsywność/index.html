<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <title>Responsywność</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Responsywna strona</h1>
        </header>

        <div class="custom-container">
            <h2>Karty inline-block</h2>
            <div class="custom-card">
                <h4>Karta 1</h4>
                <span class="card-details">Szczegóły karty 1</span>
            </div>
            <div class="custom-card">
                <h4>Karta 2</h4>
                <span class="card-details">Szczegóły karty 2</span>
            </div>
            <div class="custom-card">
                <h4>Karta 3</h4>
                <span class="card-details">Szczegóły karty 3</span>
            </div>

            <h2>Karty przy użyciu Bootstrap</h2>
            <div class="container">
                <div class="row">
                    <div class="col-md-4">
                        <div class="bootstrap-card">
                            <h4>Karta 1</h4>
                            <span class="card-details">Szczegóły karty 1</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="bootstrap-card">
                            <h4>Karta 2</h4>
                            <span class="card-details">Szczegóły karty 2</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="bootstrap-card">
                            <h4>Karta 3</h4>
                            <span class="card-details">Szczegóły karty 3</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <h2>Responsywny obraz</h2>
            <img class="map" 
                src="https://upload.wikimedia.org/wikipedia/commons/9/90/Europe_satellite_image_location_map.jpg" 
                alt="Mapa" />

            <h2>Jednostki</h2>
            <div class="box-vw">Szerokość 50vw</div>
            <div class="box-percent">Szerokość 50%</div>
        </div>

    </body>
</html>
